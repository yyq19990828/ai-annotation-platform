# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "ai-annotation-platform"

[setup]
script = '''
set -euo pipefail

export ORCA_ROOT_PATH="${CODEX_SOURCE_TREE_PATH:?Missing source checkout path}"
export ORCA_WORKTREE_PATH="${CODEX_WORKTREE_PATH:?Missing worktree path}"
cd "$ORCA_WORKTREE_PATH"

if ! command -v pnpm >/dev/null 2>&1; then
  corepack enable
fi

bash scripts/orca-worktree-setup.sh
'''

[cleanup]
script = '''
set -euo pipefail
cd "${CODEX_WORKTREE_PATH:?Missing worktree path}"
rm -rf -- .pytest_cache .ruff_cache apps/api/.pytest_cache apps/api/.ruff_cache apps/web/coverage apps/web/test-results apps/web/playwright-report docs-site/.vitepress/cache
'''

[[actions]]
name = "Web typecheck"
icon = "test"
command = "pnpm --filter @anno/web typecheck"

[[actions]]
name = "Docs build"
icon = "test"
command = "pnpm --filter @anno/docs-site build"

[[actions]]
name = "API tests"
icon = "test"
command = "cd apps/api && uv run pytest"

[[actions]]
name = "OpenAPI check"
icon = "test"
command = "pnpm openapi:check"
