[project]
name = "yolo-backend"
version = "0.1.0"
description = "YOLO (ultralytics) ML Backend for ai-annotation-platform — det/seg/pose/obb multi-task, multi-series"
requires-python = ">=3.10,<3.13"

# torch / torchvision 由 docker base image (pytorch/pytorch:2.6.0-cuda12.4-cudnn-runtime) 锁定,
# 不在此处重复声明以避免 pip 误升级覆盖预装版本.
# ultralytics 8.4.x 同时覆盖 yolov8 ~ yolo26 + rt-detr 全系预训练权重 (assets v8.3.0 + v8.4.0).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "numpy>=1.24,<3.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "prometheus-client>=0.20",
    "cryptography>=43.0.0",
    "PyJWT>=2.10,<3",
    "ultralytics>=8.4.0,<8.5",
    # Ultralytics tracker runtime dependency; bake it in instead of AutoUpdate.
    "lap>=0.5.12",
    # PerfHud · GPU util/温度/功耗 + 容器 CPU/RAM
    "pynvml>=11.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "model_pool", "model_registry", "observability", "gpu_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 共享包从 apps/_shared/* 注入: Docker 容器内由 `pip install -e /app/protocol_v2` 提供;
# 本地 pytest 通过 pythonpath 直接定位 src/.
pythonpath = [".", "../_shared/protocol_v2/src", "../_shared/mask_utils/src", "../_shared/backend_runtime/src"]
asyncio_mode = "auto"
