[project]
name = "rapidocr-backend"
version = "0.1.0"
description = "RapidOCR ML backend — OCR (det 原子 + rec 原子 + e2e composite) for ai-annotation-platform"
requires-python = ">=3.10"

# rapidocr / onnxruntime-gpu / opencv 由 Dockerfile 安装（pin rapidocr==3.9.0 + GPU 引擎 +
# opencv-python-headless），不在此声明，避免与运行时版本冲突。
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 共享协议包从 apps/_shared 注入：Docker 内 `pip install -e /app/protocol_v2`；本地 pytest 走 pythonpath。
pythonpath = [".", "../_shared/protocol_v2/src", "../_shared/backend_runtime/src"]
