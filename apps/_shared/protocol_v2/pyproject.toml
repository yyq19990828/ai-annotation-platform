[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-protocol-v2"
version = "0.1.0"
description = "ML backend 协议 v2 共享 Pydantic schema 与受控词表常量, 被 sam3 / grounded-sam2 / yolo 等 backend 复用"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# numpy 仅 mask_codec 编解码用 (惰性 import); 其余 schema/vocab 不依赖它, 故只进 test extras。
test = ["pytest>=8.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
