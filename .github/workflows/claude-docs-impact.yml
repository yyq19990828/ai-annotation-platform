name: Claude Docs Impact

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-docs-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-docs-impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch PR range
        run: git fetch --depth=100 origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Prepare docs impact hint
        run: |
          node scripts/check-doc-impact.mjs \
            --base=${{ github.event.pull_request.base.sha }} \
            --head=${{ github.event.pull_request.head.sha }} \
            --write=.tmp/docs-impact.json \
            --write-markdown=.tmp/docs-impact.md

      # Advisory scan: emits ::warning:: annotations for changelog-style version prefixes
      # added to narrative docs (never fails the build), and writes a hint for the Claude step.
      - name: Scan docs for version-prefixed style
        run: |
          node scripts/check-doc-version-prefix.mjs \
            --base=${{ github.event.pull_request.base.sha }} \
            --head=${{ github.event.pull_request.head.sha }} \
            --format=github \
            --write-markdown=.tmp/doc-version-prefix.md

      - name: Run Claude Docs Impact Review
        id: claude-docs-impact
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analyze whether PR #${{ github.event.pull_request.number }} in ${{ github.repository }} likely needs documentation updates OR new documentation files. You are the primary judge — perform a full analysis of the PR diff regardless of any rule hits.

            You have full read access to the checked-out repository. Do not judge from paths or rule hits alone: open and read whatever you need — the diff, the candidate docs themselves, and the related code — to reach a content-grounded verdict. Be thorough; read as many candidate docs as it takes to be confident — depth is preferred over speed.

            Inputs (in order of authority):
            1. The actual PR diff — **source of truth**. Always read it.
            2. `CLAUDE.md` and `docs-site/` — the project's documentation taxonomy (Diátaxis: user-guide / dev / ops / api; plus `docs/adr/` for architecture decisions and `CHANGELOG.md` for version notes). Use to decide where docs should live.
            3. `.github/docs-impact-map.json` and `.tmp/docs-impact.json` / `.tmp/docs-impact.md` — **weak hints only**, generated from path patterns. Treat them as starting points, not as a whitelist. Missing matches do NOT imply "no docs needed"; matched rules do NOT imply the listed docs are the only relevant ones. Override freely when the diff tells a different story.
            4. `.tmp/doc-version-prefix.md` — a deterministic pre-scan for the documentation style check below. **Hint only**; it may miss cases (prose phrasing) or over-flag (code samples). Confirm each against the diff.

            Output rules:
            - Return structured JSON only.
            - Each entry in `suggested_files` must include `action`: `update` for existing docs to revise, or `create` for new docs that should be added.
            - For `update` entries, propose any existing doc in the repo that the diff actually invalidates or extends — not limited to the hint set.
            - For `create` entries, propose a path that fits the existing docs taxonomy. Examples:
              * New user-facing feature with no home → `docs-site/user-guide/<role>/<feature>.md`
              * New developer concept/protocol → `docs-site/dev/concepts/<topic>.md` or `docs-site/dev/reference/<topic>.md`
              * New operational runbook → `docs-site/ops/runbooks/<topic>.md`
              * Architecturally significant change → `docs/adr/NNNN-<slug>.md` (use the next available number)
            - Only suggest `create` when (a) the PR introduces a non-trivial new capability, concept, protocol, env var, or architectural shift, AND (b) no existing doc would naturally house it.
            - Keep at most 5 suggested files total (update + create combined), deduplicated, sorted by priority.
            - Each entry should include a short `reason` (≤120 chars) explaining what to write/change and why.
            - Confidence must be one of: `high`, `medium`, `low`.
            - `style_warnings` is a separate array for the documentation style check below; it is independent of `status`/`suggested_files` (a doc-complete PR can still have style warnings, and vice versa).

            Decision rules:
            - Drive the analysis from the diff. The deterministic hints may miss things entirely or flag false positives — verify against the diff before trusting either signal.
            - Prefer repository docs paths over generic advice.
            - Mention ADR only when the change appears architectural or semantics-changing.
            - Verify by reading, not by area-matching: for every `update` candidate, open the existing doc and confirm its current text is actually contradicted, outdated, or left incomplete by the diff. If the doc already covers the change, drop it. Ground each `reason` in the specific stale passage, and set `confidence` from how directly the diff invalidates that content.
            - Treat `docsTouched` as evidence that *some* doc moved, not that the right docs were covered. If a referenced doc still reads stale after you open it, surface it.
            - When the PR diff shows anything user-visible or contract-changing without a corresponding doc edit — new API endpoint, env var, worker task, permission, ML protocol field, role, UI surface, error code, etc. — propose either an `update` for the natural existing home or a `create` for a new doc.
            - Use `needs_update` whenever you find at least one credible gap. Use `probably_not_needed` only when the diff is purely internal (refactor / test-only / build config / dependency bump with no behavior change) and nothing user-facing or contractual was added. When in doubt, prefer `uncertain` over `probably_not_needed`.

            Documentation style check (advisory):
            - Docs must read as the CURRENT state of the system, with NO user-readable version numbers. A reader should never see a `vX.Y.Z`-style token in the rendered page — neither changelog-style prefixes (`v1.2.3: ...`, `## v1.2.3`) nor inline provenance (`端点 X（v0.14.11）`, `**邮箱验证（v0.12.0+）**`, `since v0.9.13`). Version provenance, if it must be recorded, goes where readers don't see it: an HTML comment (`<!-- since v1.2.3 -->`) or YAML frontmatter (`since: v1.2.3`).
            - For every added line in this PR's doc changes (under `docs-site/**`, plus `README.md` / `DEV.md`) that introduces a user-visible `vX.Y.Z` token — in prose, a heading, a table, or a fenced code block — add one entry to `style_warnings` with the file `path`, best-effort `line`, the offending `snippet`, and a concrete `suggestion` (rewrite to current state; move the version into an HTML comment or frontmatter, or drop it).
            - Exemptions — do NOT flag: `CHANGELOG.md`, `docs/adr/**`, `docs-site/dev/adr/**`, and generated `*.generated.md`; versions inside HTML comments or frontmatter; and version tokens without a dot (e.g. "requires Node v18+", a `/v1/` route, "the v2 protocol").
            - This check is advisory: it never changes `status`. Report findings in `style_warnings` only.
          claude_args: >-
            --model claude-opus-4-8
            --json-schema
            '{"type":"object","properties":{"status":{"type":"string","enum":["needs_update","probably_not_needed","uncertain"]},"suggested_files":{"type":"array","maxItems":5,"items":{"type":"object","properties":{"path":{"type":"string"},"action":{"type":"string","enum":["update","create"]},"confidence":{"type":"string","enum":["high","medium","low"]},"reason":{"type":"string"}},"required":["path","action","confidence"],"additionalProperties":false}},"style_warnings":{"type":"array","maxItems":10,"items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"snippet":{"type":"string"},"suggestion":{"type":"string"}},"required":["path","suggestion"],"additionalProperties":false}}},"required":["status","suggested_files"],"additionalProperties":false}'

      - name: Render docs impact comment
        id: render-docs-impact-comment
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-docs-impact.outputs.structured_output }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const lines = ["<!-- claude-docs-impact -->"];
          const raw = process.env.STRUCTURED_OUTPUT;

          if (!raw) {
            lines.push("Docs impact: uncertain.");
            fs.writeFileSync(".tmp/docs-impact-comment.md", `${lines.join("\n")}\n`);
            process.exit(0);
          }

          let output;
          try {
            output = JSON.parse(raw);
          } catch {
            lines.push("Docs impact: uncertain.");
            fs.writeFileSync(".tmp/docs-impact-comment.md", `${lines.join("\n")}\n`);
            process.exit(0);
          }
          const files = Array.isArray(output.suggested_files) ? output.suggested_files : [];

          if (files.length === 0) {
            const status = output.status === "uncertain"
              ? "Docs impact: uncertain."
              : "Docs impact: probably not needed.";
            lines.push(status);
          } else {
            const fmt = (item) => {
              const reason = item.reason ? ` — ${item.reason}` : "";
              return `- \`${item.path}\` — ${item.confidence}${reason}`;
            };
            const updates = files.filter((f) => (f.action || "update") === "update");
            const creates = files.filter((f) => f.action === "create");

            lines.push("Docs impact:");
            if (updates.length > 0) {
              lines.push("");
              lines.push("**建议更新：**");
              for (const item of updates) lines.push(fmt(item));
            }
            if (creates.length > 0) {
              lines.push("");
              lines.push("**建议新增：**");
              for (const item of creates) lines.push(fmt(item));
            }
          }

          const warnings = Array.isArray(output.style_warnings) ? output.style_warnings : [];
          if (warnings.length > 0) {
            lines.push("");
            lines.push("**文档写法提醒（建议改写，不阻塞合并）：**");
            for (const w of warnings) {
              const loc = w.line ? `:${w.line}` : "";
              const sug = w.suggestion ? ` — ${w.suggestion}` : "";
              lines.push(`- \`${w.path}${loc}\`${sug}`);
            }
          }

          fs.writeFileSync(".tmp/docs-impact-comment.md", `${lines.join("\n")}\n`);
          NODE

      - name: Find previous docs impact comment
        id: find-docs-impact-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- claude-docs-impact -->"

      - name: Create or update docs impact comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-docs-impact-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: .tmp/docs-impact-comment.md
          edit-mode: replace
