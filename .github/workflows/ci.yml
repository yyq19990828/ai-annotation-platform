name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; retain every main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: annotation_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      TEST_DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      # Some pytest modules import the API router during collection. Enable the
      # guarded test-only router before the first application import.
      E2E_SEED_ENABLED: "true"
      SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: annotations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        working-directory: apps/api
        run: uv sync --extra test
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Initialize MinIO buckets
        working-directory: apps/api
        run: uv run python -c "from app.services.storage import storage_service; storage_service.ensure_all_buckets()"
      - name: alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: alembic round-trip (upgrade-then-downgrade-then-upgrade)
        working-directory: apps/api
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: OpenAPI snapshot drift check
        working-directory: apps/api
        run: |
          if ! uv run python ../../scripts/export_openapi.py --check; then
            echo "::error::OpenAPI snapshot drift. 请在 apps/api 下运行 'uv run python ../../scripts/export_openapi.py' 重生 snapshot 并提交（建议本地装 pre-commit 让它自动跑）。"
            exit 1
          fi
      - name: pytest with coverage
        working-directory: apps/api
        run: uv run pytest -q --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 示例 ML backend contract tests 保活：防 docs-site/dev/examples 与协议文档脱节。
  examples-pytest:
    name: ML examples tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: echo-ml-backend contract tests
        working-directory: docs-site/dev/examples/echo-ml-backend
        run: uv run --extra test pytest -q
      - name: mock-v2-backend contract tests
        working-directory: docs-site/dev/examples/mock-v2-backend
        run: uv run --extra test pytest -q

  # Python SDK / CLI / TUI 测试（packages/python-sdk, v0.15.2 起）。
  python-sdk-pytest:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: SDK / CLI / TUI tests
        working-directory: packages/python-sdk
        run: uv run --extra test pytest -q
      - name: Build SDK distribution
        working-directory: packages/python-sdk
        run: uv build

  vitest:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: tsc + build (codegen reads checked-in snapshot)
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm build
      # v0.8.8 · bundle size budget 守护：超过 .size-limit.json 阈值即阻断 PR。
      - name: Bundle size check
        working-directory: apps/web
        run: pnpm size
      - name: vitest with coverage
        working-directory: apps/web
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Repository quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Repository format check
        run: pnpm format:check
      - name: codegen (read snapshot for typecheck)
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm codegen
      - name: tsc --noEmit
        working-directory: apps/web
        run: pnpm typecheck
      - name: Repository lint
        run: pnpm lint
      - name: Pre-commit full repository check
        run: >-
          uv tool run --from pre-commit==4.6.1 pre-commit run
          --all-files --hook-stage manual --show-diff-on-failure
      # Enforce workflow and job naming across the repository.
      - name: Workflow naming
        run: |
          node --test scripts/check-workflow-names.test.mjs
          node scripts/check-workflow-names.mjs --strict

  docs-build:
    name: Docs build
    # 任何 PR 都跑：让 dead-link / hotkeys SoT 漂移 / snippet 不一致即时暴露。
    # 本地构建约 5s + prebuild 同步 openapi/hotkeys/snippet 约 2s。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm docs:build
        env:
          DOCS_BASE: /
        run: pnpm docs:build

  e2e-suites:
    name: Frontend E2E suites
    runs-on: ubuntu-latest
    # Each runner owns its services: seed/reset and teardown delete shared fixtures.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: default-one
            command: test:e2e --shard=1/4
            built: true
          - suite: default-two
            command: test:e2e --shard=2/4
            built: true
          - suite: default-three
            command: test:e2e --shard=3/4
            built: true
          - suite: default-four
            command: test:e2e --shard=4/4
            built: true
          - suite: mask-readonly
            command: test:e2e:mask-readonly
            built: false
          - suite: mask-native
            command: test:e2e:mask-native
            built: false
          - suite: mask-ai-native
            command: test:e2e:mask-ai-native
            built: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: annotation_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      PLAYWRIGHT_E2E_DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: annotations-test
      # The test router is opt-in and also validates the _test database suffix.
      E2E_SEED_ENABLED: "true"
      ENVIRONMENT: development
      # CI 上 Node 把 localhost 解析成 ::1，但 uvicorn --host 0.0.0.0 只听 IPv4，
      # 用 127.0.0.1 强制 IPv4 避免 ECONNREFUSED ::1:8000。
      PLAYWRIGHT_API_BASE: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: pip install uv
      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --extra test
      # services 没法给 minio/minio 镜像传 server 子命令；bitnami/minio:latest 已被下架。
      # 直接 docker run 启容器最稳，并等到 health endpoint 通后再继续，避免后续 FastAPI
      # startup 阶段反复重试拉满 health-check 窗口。
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in {1..30}; do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
      - name: alembic upgrade head
        if: matrix.built
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Start FastAPI in background
        if: matrix.built
        working-directory: apps/api
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            curl -s http://127.0.0.1:8000/health && break
            sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Generate API types for Mask suites
        if: ${{ !matrix.built }}
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm codegen
      - name: Build frontend
        if: matrix.built
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm build --mode e2e
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite
        working-directory: apps/web
        run: pnpm ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: apps/web/playwright-report/
          retention-days: 7

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [e2e-suites]
    if: always()
    steps:
      - name: Require every E2E suite to pass
        env:
          E2E_RESULT: ${{ needs.e2e-suites.result }}
        run: test "$E2E_RESULT" = success
