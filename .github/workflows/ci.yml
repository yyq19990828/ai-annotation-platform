name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs; retain every main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: annotation_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      TEST_DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      # Some pytest modules import the API router during collection. Enable the
      # guarded test-only router before the first application import.
      E2E_SEED_ENABLED: "true"
      SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: annotations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        working-directory: apps/api
        run: uv sync --extra test
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Initialize MinIO buckets
        working-directory: apps/api
        run: uv run python -c "from app.services.storage import storage_service; storage_service.ensure_all_buckets()"
      - name: alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: alembic round-trip (upgrade-then-downgrade-then-upgrade)
        working-directory: apps/api
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: OpenAPI snapshot drift check
        working-directory: apps/api
        run: |
          if ! uv run python ../../scripts/export_openapi.py --check; then
            echo "::error::OpenAPI snapshot drift. 请在 apps/api 下运行 'uv run python ../../scripts/export_openapi.py' 重生 snapshot 并提交（建议本地装 pre-commit 让它自动跑）。"
            exit 1
          fi
      - name: pytest with coverage
        working-directory: apps/api
        run: >-
          uv run pytest -q --cov=app --cov-report=xml --cov-report=term-missing
          --durations=30 --junitxml=pytest-results.xml
      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: apps/api/pytest-results.xml
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 示例 ML backend contract tests 保活：防 docs-site/dev/examples 与协议文档脱节。
  examples-pytest:
    name: ML examples tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: echo-ml-backend contract tests
        working-directory: docs-site/dev/examples/echo-ml-backend
        run: uv run --extra test pytest -q
      - name: mock-v2-backend contract tests
        working-directory: docs-site/dev/examples/mock-v2-backend
        run: uv run --extra test pytest -q

  # Python SDK / CLI / TUI 测试（packages/python-sdk, v0.15.2 起）。
  python-sdk-pytest:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: SDK / CLI / TUI tests
        working-directory: packages/python-sdk
        run: uv run --extra test pytest -q
      - name: Build SDK distribution
        working-directory: packages/python-sdk
        run: uv build

  vitest:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: tsc + build (codegen reads checked-in snapshot)
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm build
      # v0.8.8 · bundle size budget 守护：超过 .size-limit.json 阈值即阻断 PR。
      - name: Bundle size check
        working-directory: apps/web
        run: pnpm size
      - name: vitest with coverage
        working-directory: apps/web
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Repository quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Repository format check
        run: pnpm format:check
      - name: codegen (read snapshot for typecheck)
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm codegen
      - name: tsc --noEmit
        working-directory: apps/web
        run: pnpm typecheck
      - name: Repository lint
        run: pnpm lint
      - name: Pre-commit full repository check
        run: >-
          uv tool run --from pre-commit==4.6.1 pre-commit run
          --all-files --hook-stage manual --show-diff-on-failure
      - name: Repository Node script tests
        run: >-
          node --test scripts/check-workflow-names.test.mjs
          scripts/dev-worktree.test.mjs scripts/plan-e2e-suites.test.mjs
      - name: Workflow naming
        run: node scripts/check-workflow-names.mjs --strict

  docs-build:
    name: Docs build
    # 任何 PR 都跑：让 dead-link / hotkeys SoT 漂移 / snippet 不一致即时暴露。
    # 本地构建约 5s + prebuild 同步 openapi/hotkeys/snippet 约 2s。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm docs:build
        env:
          DOCS_BASE: /
        run: pnpm docs:build

  e2e-plan:
    name: Frontend E2E planning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        env:
          E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$E2E_BASE_SHA"
      - name: Select E2E suites
        id: plan
        env:
          E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/plan-e2e-suites.mjs "$E2E_BASE_SHA" >> "$GITHUB_OUTPUT"

  e2e-suites:
    name: Frontend E2E execution
    needs: [e2e-plan]
    uses: ./.github/workflows/e2e-run.yml
    with:
      matrix: ${{ needs.e2e-plan.outputs.matrix }}

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [e2e-plan, e2e-suites]
    if: always()
    steps:
      - name: Require every E2E suite to pass
        env:
          E2E_PLAN_RESULT: ${{ needs.e2e-plan.result }}
          E2E_RESULT: ${{ needs.e2e-suites.result }}
        run: |
          test "$E2E_PLAN_RESULT" = success
          test "$E2E_RESULT" = success
