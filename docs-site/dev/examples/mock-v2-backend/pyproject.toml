# 仅为 contract tests 可独立运行 (uv run --extra test pytest);
# 示例本体零外部依赖, 部署仍按 main.py docstring 用 requirements.txt。
[project]
name = "example-mock-v2-backend"
version = "0.0.0"
description = "ml-backend 协议 v2.1 完整形态参考实现 (mock, 无真实推理)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
