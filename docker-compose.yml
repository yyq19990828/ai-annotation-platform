services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      # 默认值 = dev 凭据 (docker compose up 不带 --env-file 时生效)。
      # 生产用 --env-file .env.production 覆盖, 须与 DATABASE_URL 中的用户名/密码/库名一致。
      POSTGRES_DB: ${POSTGRES_DB:-annotation}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用容器内 env 展开 ($$ → $), 不写死 user/annotation, 改了凭据探针仍然有效。
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # v0.10.24 · dev SMTP 收件箱。后端 email.py 的 admin「发送测试邮件」按钮
  # 把邮件投到这里; Web UI http://localhost:8025 直接看收到的邮件, 不外发真实邮件。
  # 配合 .env: SMTP_HOST=localhost SMTP_PORT=1025 SMTP_FROM=noreply@local.test
  # (API 跑 host 时连 localhost:1025; 若 API 也进 Docker 则填 SMTP_HOST=mailpit)。
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # api / web 不在本文件：dev 跑宿主机 (uvicorn --reload + pnpm dev:web，见 DEV.md)；
  # 生产以容器形态在叠加文件 docker-compose.prod.yml 定义，用
  #   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d
  # 拉起。区别详见 docs-site/dev/concepts/runtime-environments.md。

  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q default,ml,media,gpu,cleanup,audit --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/annotation
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # v0.10.16 · DuckDB 离线分析视图 (ROADMAP §1.6); host ./data/duckdb 挂到容器 /var/lib/duckdb
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb
    volumes:
      # v0.10.16 · DuckDB 文件 bind mount, worker 写 / API 跑 host 时只读
      - ./data/duckdb:/var/lib/duckdb
      # v0.10.25 · dev 源码热挂载: 改 worker 业务码 / 加 alembic 迁移只需 docker restart, 不必 rebuild。
      # deps 装在 --system site-packages (见 Dockerfile.api), 不在 /app 下, 挂 /app 不盖依赖;
      # 匿名卷屏蔽 host 的 apps/api/.venv 避免泄入容器。Celery 无 --reload, 改码后仍需 restart。
      - ./apps/api:/app
      - /app/.venv
    # v0.10.24 · worker 健康探针: inspect ping 自身节点 (-d 限定当前 worker, 不等其它副本)。
    # 必须用 CMD-SHELL — exec-form 无 shell, $$HOSTNAME 不展开会 ping 字面节点名导致永远 unhealthy。
    # start_period 留足 image 冷启 + broker 连接; SIGTERM 后给 30s warm shutdown 跑完在途任务。
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # v0.10.27 · 导出专用 worker. 独立 export 队列资源隔离, 导出大任务不拖累预标/媒体处理。
  # 配置照抄 celery-worker, 仅改 -Q export --concurrency=2 与容器名。
  celery-worker-export:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q export --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/annotation
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # v0.10.16 · DuckDB 离线分析视图 (ROADMAP §1.6); host ./data/duckdb 挂到容器 /var/lib/duckdb
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb
    volumes:
      # v0.10.16 · DuckDB 文件 bind mount, worker 写 / API 跑 host 时只读
      - ./data/duckdb:/var/lib/duckdb
      # v0.10.25 · dev 源码热挂载: 改 worker 业务码 / 加 alembic 迁移只需 docker restart, 不必 rebuild。
      # deps 装在 --system site-packages (见 Dockerfile.api), 不在 /app 下, 挂 /app 不盖依赖;
      # 匿名卷屏蔽 host 的 apps/api/.venv 避免泄入容器。Celery 无 --reload, 改码后仍需 restart。
      - ./apps/api:/app
      - /app/.venv
    # v0.10.24 · worker 健康探针: inspect ping 自身节点 (-d 限定当前 worker, 不等其它副本)。
    # 必须用 CMD-SHELL — exec-form 无 shell, $$HOSTNAME 不展开会 ping 字面节点名导致永远 unhealthy。
    # start_period 留足 image 冷启 + broker 连接; SIGTERM 后给 30s warm shutdown 跑完在途任务。
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # v0.9.11 · Celery beat 独立 service. worker 与 beat 解耦 (worker 可 scale 多副本,
  # beat 必须单实例避免 schedule 重复触发). 复用同一 image (Dockerfile.api).
  # PerfHud 1s 推送 + audit partition 月度任务 + ml health 60s 等都依赖此进程.
  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/annotation
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      # v0.10.25 · dev 源码热挂载 (同 celery-worker): 改 beat schedule 只需 restart 不必 rebuild。
      - ./apps/api:/app
      - /app/.venv
    # v0.10.24 · beat 是调度进程不响应 inspect ping, 故无 healthcheck;
    # 仅给优雅关闭窗口让它落盘 /tmp/celerybeat-schedule 后退出。
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # v0.9.0+ Grounded-SAM-2 ML Backend (GroundingDINO + SAM 2.1).
  # 默认 GPU profile, dev 无 GPU 笔记本不会被拉起; 启用方式:
  #   docker compose --profile gpu up grounded-sam2-backend
  # 首次启动会自动下载 checkpoints (~900MB), start_period 留足 120s.
  grounded-sam2-backend:
    build:
      # v0.9.4 phase 3: build context 升级到 apps/ 以便 COPY 兄弟目录 _shared/mask_utils
      # (与 v0.10.x sam3-backend 共用 mask→polygon 简化逻辑). Dockerfile 内所有 COPY 路径
      # 已加 grounded-sam2-backend/ 前缀; 历史 `docker build apps/grounded-sam2-backend/` 失效.
      context: ./apps
      dockerfile: grounded-sam2-backend/Dockerfile
    profiles: ["gpu"]
    ports:
      - "8001:8001"
    environment:
      SAM_VARIANT: ${SAM_VARIANT:-tiny}
      DINO_VARIANT: ${DINO_VARIANT:-T}
      BOX_THRESHOLD: ${BOX_THRESHOLD:-0.35}
      TEXT_THRESHOLD: ${TEXT_THRESHOLD:-0.25}
      HF_HOME: /app/.cache/huggingface
      LOG_LEVEL: ${GSAM2_LOG_LEVEL:-INFO}
      # B-28+ · 空闲 N 秒后自动卸载模型释放显存; <=0 关闭定时卸载, 仍可手动 POST /unload.
      IDLE_UNLOAD_SECONDS: ${IDLE_UNLOAD_SECONDS:-600}
      IDLE_CHECK_INTERVAL: ${IDLE_CHECK_INTERVAL:-60}
      # v0.10.23 · ModelPool 同容器内并存的变体数上限 (LRU). 显存预算:
      #   单变体常驻 ~2-4GB (tiny/small) · large+SwinB 峰值 ~6-8GB.
      #   4060(8G) 建议 1; 3090(24G) 1-2; A100 2-4. 默认 1 = 维持单变体常驻行为.
      MODEL_POOL_CAP: ${MODEL_POOL_CAP:-1}
      # pool 满 + 并发 miss 时排队等待显存腾挪 / 同变体 build 的超时 (秒), 超时返回 503.
      MODEL_POOL_BUILD_TIMEOUT: ${MODEL_POOL_BUILD_TIMEOUT:-30}
      # v0.10.23 · entrypoint 启动时额外预拉的变体 checkpoint (主变体 SAM_VARIANT/DINO_VARIANT
      # 之外). pool 能服务多变体, 但只有这里声明 (+ 主变体) 的 checkpoint 会落盘; 运行期请求
      # 未预拉的变体会 503. 逗号分隔. 默认全量, 让 pool 任意切换不踩 checkpoint 缺失;
      # 磁盘紧张时可裁剪 (tiny~150M / small~180M / base_plus~320M / large~900M · SwinB~940M).
      PREFETCH_SAM_VARIANTS: ${PREFETCH_SAM_VARIANTS:-tiny,small,base_plus,large}
      PREFETCH_DINO_VARIANTS: ${PREFETCH_DINO_VARIANTS:-T,B}
      # v0.10.35 §B · sam2_video tracker 独立显存池 (与图片池预算分离, 互不驱逐).
      VIDEO_MODEL_POOL_CAP: ${VIDEO_MODEL_POOL_CAP:-1}
      VIDEO_MODEL_POOL_BUILD_TIMEOUT: ${VIDEO_MODEL_POOL_BUILD_TIMEOUT:-60}
      # 单次 init_state 一次性加载的最大帧数 (安全上限, 防超长窗口灌爆显存).
      VIDEO_TRACKER_MAX_WINDOW_FRAMES: ${VIDEO_TRACKER_MAX_WINDOW_FRAMES:-300}
      # video 池独立 idle 卸载 (与图片池 IDLE_UNLOAD_SECONDS 各自计时); <=0 关闭.
      VIDEO_IDLE_UNLOAD_SECONDS: ${VIDEO_IDLE_UNLOAD_SECONDS:-600}
    volumes:
      - gsam2_checkpoints:/app/checkpoints
      - gsam2_hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # v0.10.0+ SAM 3 ML Backend (facebookresearch/sam3 + facebook/sam3.1 weights).
  # 独立 profile `gpu-sam3` (与 grounded-sam2 的 `gpu` profile 解耦, 让用户单独控制):
  #   docker compose --profile gpu-sam3 up sam3-backend
  # 两个 backend 可并存; sam3 是高精度首选 (3090/A100), grounded-sam2 兜底 (4060 友好).
  # 首次启动会下载 sam3.1 权重 (~3.2GB, gated, 需 HF_TOKEN), start_period 留足 180s.
  sam3-backend:
    build:
      context: ./apps
      dockerfile: sam3-backend/Dockerfile
    profiles: ["gpu-sam3"]
    ports:
      - "8002:8002"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /app/.cache/huggingface
      SAM3_EMBEDDING_CACHE_SIZE: ${SAM3_EMBEDDING_CACHE_SIZE:-32}
      SAM3_SCORE_THRESHOLD: ${SAM3_SCORE_THRESHOLD:-0.5}
      LOG_LEVEL: ${SAM3_LOG_LEVEL:-INFO}
      # 空闲 N 秒后自动卸载模型释放显存; <=0 关闭定时卸载, 仍可手动 POST /unload.
      # sam3 显存占用 ~7GB FP16, 与 grounded-sam2 并存时强烈建议保留 idle unload.
      # SAM3_ 前缀, 与 grounded-sam2 的 IDLE_UNLOAD_SECONDS 解耦, 两个 backend 可独立调.
      SAM3_IDLE_UNLOAD_SECONDS: ${SAM3_IDLE_UNLOAD_SECONDS:-600}
      SAM3_IDLE_CHECK_INTERVAL: ${SAM3_IDLE_CHECK_INTERVAL:-60}
    volumes:
      - sam3_checkpoints:/app/checkpoints
      - sam3_hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # v0.8.8 · 可观测性 stack（默认 profile=monitoring 不启动，避免 dev 多吃 ~200MB）
  # 启动方式：`docker compose --profile monitoring up -d prometheus grafana`
  # 注意：prometheus scrape 的 host.docker.internal 仅在 Docker Desktop（Mac/Win）
  # 与 Linux 4.20+ docker compose 自动解析；不通时把 prometheus.yml 中 target 改成
  # 宿主机 LAN IP 即可。
  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=14d"
    extra_hosts:
      # Linux 上 host.docker.internal 默认未解析；显式映射到宿主机 gateway。
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.4.0
    profiles: ["monitoring"]
    ports:
      - "3001:3000"  # 避开前端 dev 3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin  # dev-only；production 改 env
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  gsam2_checkpoints:
  gsam2_hf_cache:
  sam3_checkpoints:
  sam3_hf_cache:
  prometheus_data:
  grafana_data:
