# v0.11.21 · ML backend 告警规则。Prometheus 周期 evaluate，满足 for: 时长后 firing，
# 推给 alertmanager（见 prometheus.yml alerting 段）。
#
# 误报防护：MLBackendDown 只覆盖 job="ml-backends" 的 target，而该 job 由 http_sd 从
# ml_backends 表（state != "disconnected"）生成 —— 只有显式 disconnected 的 backend
# 被排除；state="error"（health 探活失败）仍在 target 列表里，5m 后会触发告警（这是
# 设计意图，探活失败本就该被发现）。运维带外维护时请把 backend 置 disconnected，
# 否则将触发 MLBackendDown。for: 再挡瞬时抖动。
groups:
  - name: ml-backends
    rules:
      # 注：summary/description 同时带 service + instance(host:port)。`ml_backends.name`
      # 没有 unique 约束，同名 backend 出现时 service label 会撞车；instance 由
      # Prometheus 从 http_sd target 自动注入，是唯一定位 SRE 用得上的物理标识。
      - alert: MLBackendDown
        expr: up{job="ml-backends"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ML backend {{ $labels.service }} ({{ $labels.instance }}) 离线 ≥5m"
          description: "Prometheus 连续 5m 抓不到 {{ $labels.service }}（{{ $labels.instance }}）的 /metrics。"

      - alert: GPUMemoryHigh
        expr: gpu_memory_used_mb / gpu_memory_total_mb > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} ({{ $labels.instance }}) 显存占用 >90% 持续 10m"
          description: "GPU 显存占用 {{ $value | humanizePercentage }}（used/total），可能触发 OOM 或显存排队。"

      # sum by 显式带 instance，避免同名 backend 的延迟桶被合并。
      - alert: InferenceLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, service, instance) (rate(inference_latency_seconds_bucket[5m]))) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} ({{ $labels.instance }}) 推理 P95 >10s 持续 10m"
          description: "P95 推理延迟 {{ $value }}s，检查 GPU 负载 / 模型变体 / 显存驱逐。"

  - name: raster-mask-content
    rules:
      - alert: RasterMaskContentCorruption
        expr: sum(rate(raster_mask_content_errors_total{reason=~"missing_object|digest_mismatch|size_mismatch|run_mismatch|byte_mismatch|invalid_encoding|invalid_payload"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Raster Mask 内容校验错误持续 5m"
          description: "{{ $value }} errors/s；先按 operation/reason 查 Grafana，再用同时段 API/worker 日志定位 request 与 task。"

      - alert: RasterMaskStorageUnavailable
        expr: sum(rate(raster_mask_content_errors_total{reason="storage_unavailable"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Raster Mask 对象存储不可用持续 5m"
          description: "{{ $value }} errors/s；检查 MinIO 健康、网络、bucket 权限和同时段 raster mask 请求日志。"

      - alert: RasterMaskInventoryMetricMissing
        expr: absent(raster_mask_active_geometries{kind="annotation"}) or absent(raster_mask_active_geometries{kind="prediction"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Raster Mask 活跃库存指标缺失"
          description: "annotation/prediction 固定序列已缺失 15m；检查 API 健康巡检、GC 任务与 Prometheus scrape。"

  - name: mask-ai
    rules:
      - alert: MaskAIFailureRateHigh
        expr: sum(rate(mask_ai_operations_total{outcome="error"}[10m])) / clamp_min(sum(rate(mask_ai_operations_total[10m])), 0.001) > 0.1 and sum(increase(mask_ai_operations_total[10m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mask AI 失败率持续高于 10%"
          description: "至少 10 次操作且失败率持续超阈值；按 operation/prompt_family/output_geometry 排查。"

      - alert: MaskAIConflictRateHigh
        expr: sum(increase(mask_ai_operations_total{outcome="conflict"}[10m])) / clamp_min(sum(increase(mask_ai_operations_total[10m])), 1) > 0.25 and sum(increase(mask_ai_operations_total{outcome="conflict"}[10m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mask AI 冲突率持续高于 25%"
          description: "至少 5 次 409 冲突；检查 source version、segment lease、active correction lease 与重复提交。"

      - alert: VideoCorrectionQueuedTooLong
        expr: mask_ai_correction_oldest_age_seconds{status="queued"} > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "视频 Mask 纠错排队超过 10 分钟"
          description: "检查 gpu 队列、Celery worker、backend 路由和入队状态。"

      - alert: VideoCorrectionRunningStuck
        expr: mask_ai_correction_oldest_age_seconds{status="running"} > 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "视频 Mask 纠错运行超过 60 分钟"
          description: "检查 worker、路由租约和 backend 会话；不要直接覆盖人工关键帧。"

      - alert: VideoCorrectionReviewBacklog
        expr: max(mask_ai_correction_oldest_age_seconds{status=~"pending_review|partially_reviewed"}) > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "视频 Mask 纠错候选待审超过 24 小时"
          description: "候选将在 TTL 清理时释放 staged 引用与同轨活跃租约。"

      - alert: MaskAIExpiredDecisionBacklog
        expr: mask_ai_oldest_expired_decision_age_seconds > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Mask AI 过期幂等快照积压超过 26 小时"
          description: "检查每日 Raster Mask GC/cleanup beat 是否正常执行。"

      - alert: MaskAIObservabilityMetricMissing
        expr: absent(mask_ai_correction_jobs{status="queued"}) or absent(mask_ai_staged_mask_references{job_kind="correction"}) or absent(mask_ai_accept_decisions{state="active"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mask AI 权威库存指标缺失"
          description: "检查 API /metrics 数据库访问和 Prometheus scrape；固定零序列不应消失。"
