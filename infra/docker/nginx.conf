map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Re-resolve Compose service addresses after an API/MinIO container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $storage_upstream http://minio:9000;
    client_max_body_size 8g;
    client_body_timeout 300s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # v0.9.11/v0.10.12 · CSP nonce 收紧. 与 SecurityHeadersMiddleware 分工:
    # - Nginx 负责 HTML 出站 CSP (script/style-src 含 per-request nonce)
    # - FastAPI middleware 负责 API 响应 CSP (无 nonce, script/style-src 仅 'self')
    # 详见 docs/adr/0010-security-headers-middleware.md
    location / {
        # HTML 出站时 sub_filter 把 __CSP_NONCE__ 占位符 (vite plugin 注入) 替换为
        # $request_id (Nginx 自动生成的 32-char hex). 关闭 once, 多处 script/style + meta 都替.
        sub_filter '__CSP_NONCE__' $request_id;
        sub_filter_once off;

        # CSP header 用同一个 $request_id, 与 HTML 内 nonce 属性保持一致.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'nonce-$request_id'; script-src 'self' 'nonce-$request_id' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https: wss: ws:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        try_files $uri $uri/ /index.html;
    }

    # v0.11.21 · /api/v1/internal/* 是 Prometheus http_sd 之类内网消费端点
    # (响应含 backend host:port / project_id 等拓扑信息), 不应经反代外泄.
    # 与根路径 /metrics 同样靠"nginx 不代理"实现网段隔离; 必须排在 /api/ 之前.
    location = /api/v1/internal {
        return 404;
    }

    location ^~ /api/v1/internal/ {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The edge proxy limits this route to the deployment's buckets. Preserve query
    # signatures and the signing endpoint's Host while removing the public prefix.
    location /minio/ {
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass $storage_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection '';
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
