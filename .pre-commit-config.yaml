# Pre-commit hooks: Python 用 ruff，前端用本地 eslint + tsc。
# 首次安装：pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # --unsafe: 仍校验 YAML 语法, 但不拒绝 docker-compose override 里的自定义标签
      # (如 `!override` / `!reset` 强制替换列表字段)。
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict

  # v0.7.5: ruff-format 移到 CI（lint job 跑 `ruff format --check`），
  # 本地仅保留 ruff lint --fix，commit 速度更快、与编辑器 format on save 不冲突。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^apps/api/
        args: ["--fix"]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        entry: pnpm --filter @anno/web lint
        language: system
        files: ^apps/web/.+\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: tsc-web
        name: tsc --noEmit (apps/web)
        entry: pnpm --filter @anno/web exec tsc -b --noEmit
        language: system
        files: ^apps/web/.+\.(ts|tsx)$
        pass_filenames: false

      # v0.8.8 · 修改 schema/路由/auth 时自动重新生成 OpenAPI snapshot 并 git add，
      # 避免 CI test_openapi_contract.py 红灯 + 让 PR 作者忘记 export 的事变成
      # 提交即修复。脚本会同步更新 docs-site/api/openapi.json 供 docs-site build。
      - id: regen-openapi-snapshot
        name: Regenerate OpenAPI snapshot (apps/api)
        entry: bash -c 'cd apps/api && uv run python ../../scripts/export_openapi.py && cd ../.. && git add apps/api/openapi.snapshot.json docs-site/api/openapi.json 2>/dev/null || true'
        language: system
        files: ^apps/api/app/(api|schemas)/.*\.py$
        pass_filenames: false

      # v0.18.30 · 改 capability registry 受控词表(或其响应 schema/序列化)时, 重导
      # capability-registry snapshot 并 git add。前端 codegen 读此 snapshot 生成受控词表
      # 常量(apps/web/scripts/gen-capability-vocab.mjs); CI test_capability_registry_contract
      # 兜底。把"忘了重导致前端 stale"变成提交即修复(与 regen-openapi-snapshot 同思路)。
      - id: regen-capability-registry-snapshot
        name: Regenerate capability registry snapshot (apps/api)
        entry: bash -c 'cd apps/api && uv run python ../../scripts/export_capability_registry.py && cd ../.. && git add apps/api/capability-registry.snapshot.json 2>/dev/null || true'
        language: system
        files: ^apps/api/app/services/capability_registry\.py$|^apps/api/app/schemas/ml_capabilities\.py$|^apps/api/app/api/v1/ml_capabilities\.py$
        pass_filenames: false

      # 改快捷键 / 工作台设置定义源时,自动重新生成对应的 .generated.md 并 git add,
      # 把"忘了重新生成导致文档漂移"变成提交即修复(与 regen-openapi-snapshot 同思路)。
      # CI 侧另有 docs-site `check:codegen`(--check)作为兜底闸门。
      - id: regen-doc-codegen
        name: Regenerate generated docs (hotkeys + workbench settings)
        entry: bash -c 'node docs-site/scripts/generate-hotkeys.mjs && node docs-site/scripts/generate-settings.mjs && git add docs-site/user-guide/workbench/hotkeys.generated.md docs-site/user-guide/workbench/settings.generated.md 2>/dev/null || true'
        language: system
        files: ^apps/web/src/(pages/Workbench/state/(hotkeys|workbenchSettingsFields)|api/auth)\.ts$
        pass_filenames: false

      # 文档写法提醒(仅提醒, 不阻塞): 标记把代码改动写成 changelog 式版本前缀
      # (如 `v1.2.3: ...` / `## v1.2.3`)的叙述性文档, 建议改为融入正文或放进 HTML 注释。
      # verbose 让提醒在提交时始终显示; 脚本永远 exit 0, 不会拦截提交。
      - id: doc-version-prefix
        name: Check docs for version-prefixed style (advisory)
        entry: node scripts/check-doc-version-prefix.mjs --staged
        language: system
        files: ^(docs-site/.*\.md|README\.md|DEV\.md)$
        exclude: ^(CHANGELOG\.md|docs/adr/|docs-site/dev/adr/|.*\.generated\.md)$
        pass_filenames: false
        verbose: true
